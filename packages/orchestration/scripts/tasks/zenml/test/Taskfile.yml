version: "3"

tasks:
  debug:
    cmds:
      - echo "test is working ok"
  plot:
    dir: ./test
    vars:
      STACK: '{{default "stack-local" .STACK}}'
    cmds:
      - uv run zenml stack set {{.STACK}}
      - uv run plot.py
  skypilot:
    dir: ./test
    vars:
      STACK: '{{default "stack-local" .STACK}}'
    cmds:
      - uv run zenml stack set {{.STACK}}
      - uv run simple_sky.py
