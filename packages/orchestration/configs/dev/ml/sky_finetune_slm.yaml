steps:
  sky_finetuning_slm:
    enable_cache: false
    parameters:
      sky_config:
        resources:
          cloud: gcp 
          image_id: docker:nvcr.io/nvidia/cuda:12.1.1-cudnn8-devel-ubuntu20.04
          accelerators: L4:1

        workdir: .

        setup: |
          echo "Hello, SkyPilot!"
          apt install git -y
          pip install uv
          uv python install 3.11
          echo "Running setup commands..."
          conda deactivate
          sudo apt update && apt install -y g++ make build-essential 
          cd /lmorbits/packages/orchestration
          uv sync 
          uv run task zenml:setup:all-integrations
        
        run: |
          echo "Executing main task..."
          conda deactivate
          cd /lmorbits/packages/orchestration
          uv run task zenml:pipelines:dev:unsloth_finetuning_slm_pipeline
          

        # run: |
