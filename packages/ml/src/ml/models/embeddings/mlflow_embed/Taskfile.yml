version: "3"

tasks:
  push:
    vars:
      MODEL_NAME: '{{ default "rag_embeddings" .MODEL_NAME }}'
    cmds:
      - echo $MLFLOW_TRACKING_URI
      - rm -rf serve/.venv
      - uv run mlflow_run.py --model_name {{.MODEL_NAME}}

  download:
    dir: tests
    cmds:
      - uv run mlflow_download.py

  serve:
    dir: tests/{{.model_name}}/serve
    cmds:
      - uv sync
      - uv run task serve
